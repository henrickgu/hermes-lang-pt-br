        title: Um firewall bloqueou a requisição
        body: Um firewall ou CDN na frente de {0} bloqueou o pedido antes de chegar ao modelo — sua chave provavelmente está ok. Defina um cabeçalho User-Agent via extra_headers do provedor em Configurações, ou troque de provedor, e envie sua mensagem de novo.
